<ion-content>
  <div class="page-title-row">
    <span class="page-title">Mercado</span>
    <ion-button fill="clear" size="small" class="btn-desmarcar" (click)="desmarcarTodo()">
      <ion-icon name="refresh-outline" slot="start"></ion-icon>
      <ion-label>Desmarcar todo</ion-label>
    </ion-button>
  </div>
  <!-- Supermercado -->
  <div class="section-header">
    <div class="section-icon section-icon--cart">
      <ion-icon name="cart-outline"></ion-icon>
    </div>
    <span class="section-title">Supermercado</span>
    <span class="section-count">{{ supermercado().length }}</span>
  </div>
  @for (item of supermercado(); track item.id) {
    <ion-card class="item-card" [class.item-comprado]="item.comprado">
      <div class="item-card-body">
        <ion-checkbox [checked]="item.comprado" (ionChange)="toggleComprado(item)"></ion-checkbox>
        <div class="item-info">
          <span class="item-nombre">{{ item.nombre }}</span>
          <span class="item-sub">{{ item.duracion }}</span>
        </div>
        <button class="action-btn action-btn--edit" (click)="editar(item)">
          <ion-icon name="create-outline"></ion-icon>
        </button>
        <button class="action-btn action-btn--delete" (click)="eliminar(item)">
          <ion-icon name="trash-outline"></ion-icon>
        </button>
      </div>
    </ion-card>
  }

  <!-- Fruver -->
  <div class="section-header">
    <div class="section-icon section-icon--leaf">
      <ion-icon name="leaf-outline"></ion-icon>
    </div>
    <span class="section-title">Fruver</span>
    <span class="section-count">{{ fruver().length }}</span>
  </div>
  @for (item of fruver(); track item.id) {
    <ion-card class="item-card" [class.item-comprado]="item.comprado">
      <div class="item-card-body">
        <ion-checkbox [checked]="item.comprado" (ionChange)="toggleComprado(item)"></ion-checkbox>
        <div class="item-info">
          <span class="item-nombre">{{ item.nombre }}</span>
          <span class="item-sub">{{ item.duracion }}</span>
        </div>
        <button class="action-btn action-btn--edit" (click)="editar(item)">
          <ion-icon name="create-outline"></ion-icon>
        </button>
        <button class="action-btn action-btn--delete" (click)="eliminar(item)">
          <ion-icon name="trash-outline"></ion-icon>
        </button>
      </div>
    </ion-card>
  }
</ion-content>

<ion-fab slot="fixed" horizontal="end" vertical="bottom">
  <ion-fab-button (click)="agregarActual()">
    <ion-icon class="float-icon" name="add-outline"></ion-icon>
  </ion-fab-button>
</ion-fab>
