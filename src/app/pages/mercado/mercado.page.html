<ion-content>
  <div class="page-title-row">
    <span class="page-title">Mercado</span>
    <div class="page-title-acciones">
      @if (hayPendientes()) {
        <ion-button fill="clear" size="small" class="page-title-btn" aria-label="Compartir lista" (click)="compartirLista()">
          <ion-icon name="share-outline" slot="start"></ion-icon>
        </ion-button>
      }
      @if (hayComprados()) {
        <ion-button fill="clear" size="small" class="page-title-btn" (click)="desmarcarTodo()">
          <ion-icon name="refresh-outline" slot="start"></ion-icon>
          <ion-label>Desmarcar todo</ion-label>
        </ion-button>
      }
    </div>
  </div>
  <p class="page-subtitle">Lo que marques como comprado pasa a la nevera</p>
  @for (s of secciones; track s.categoria) {
    <app-seccion-plegable [titulo]="s.titulo" [icono]="s.icono" [tono]="s.tono" [cantidad]="s.cantidad()">
      @for (item of s.items(); track item.id) {
        <ion-card #fila class="item-card" [class.item-comprado]="item.comprado" (click)="toggleComprado(item, !item.comprado)">
          <div class="item-card-body">
            <ion-checkbox [checked]="item.comprado"></ion-checkbox>
            <div class="item-info">
              <span class="item-nombre">{{ item.nombre }}</span>
              <span class="item-sub">{{ item.duracion }}</span>
            </div>
            <button class="action-btn action-btn--edit" [attr.aria-label]="'Editar ' + item.nombre" (click)="editar(item); $event.stopPropagation()">
              <ion-icon name="create-outline"></ion-icon>
            </button>
            <button class="action-btn action-btn--delete" [attr.aria-label]="'Eliminar ' + item.nombre" (click)="eliminar(item); $event.stopPropagation()">
              <ion-icon name="trash-outline"></ion-icon>
            </button>
          </div>
        </ion-card>
      } @empty {
        <div class="seccion-vacia">
          <span>{{ s.vacio }}</span>
          <ion-button fill="clear" size="small" (click)="restaurarBase(s.categoria)">
            <ion-icon name="refresh-outline" slot="start"></ion-icon>
            Cargar lista base
          </ion-button>
        </div>
      }
    </app-seccion-plegable>
  }
</ion-content>

<ion-fab slot="fixed" horizontal="end" vertical="bottom">
  <ion-fab-button (click)="agregar()">
    <ion-icon class="float-icon" name="add-outline"></ion-icon>
  </ion-fab-button>
</ion-fab>
