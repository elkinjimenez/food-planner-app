<ion-content>
  <div class="page-title-row">
    <div class="page-title">Hidratación</div>
  </div>
  <p class="page-subtitle">Registra los vasos de agua que tomas hoy</p>
  <div class="agua-container">
    <!-- Anillo de progreso -->
    <div class="progreso-ring">
      <svg viewBox="0 0 200 200" class="ring-svg">
        <circle cx="100" cy="100" r="85" class="ring-bg" />
        <circle
          cx="100"
          cy="100"
          r="85"
          class="ring-fill"
          [style.stroke-dashoffset]="534 - (534 * progreso())"
        />
      </svg>
      <div class="ring-center">
        <ion-icon name="water" class="ring-icon"></ion-icon>
        <span class="ring-vasos">{{ registro().vasos }}</span>
        <span class="ring-meta">/ {{ meta }} vasos</span>
      </div>
    </div>

    @if (cumplido()) {
      <div class="meta-msg">
        <ion-icon name="water"></ion-icon>
        ¡Meta diaria cumplida! 🎉
      </div>
    } @else {
      <div class="meta-msg meta-msg--pendiente">
        Faltan {{ meta - registro().vasos }} vasos para tu meta
      </div>
    }

    <!-- Botones -->
    <div class="botones">
      <ion-button fill="solid" class="btn-circ btn-restar" (click)="restarVaso()">
        <ion-icon name="remove-outline" slot="icon-only"></ion-icon>
      </ion-button>
      <ion-button fill="solid" class="btn-circ btn-sumar" (click)="sumarVaso()">
        <ion-icon class="float-icon" name="add-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </div>

    <ion-button fill="clear" class="btn-reiniciar" (click)="reiniciar()">
      <ion-icon name="water-outline" slot="start"></ion-icon>
      <ion-label>Reiniciar</ion-label>
    </ion-button>

    <span class="nota">Cada vaso ≈ 250 ml · Meta: {{ meta * 250 }} ml</span>
  </div>
</ion-content>
