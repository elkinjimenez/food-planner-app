<ion-content>
  <div class="page-title-row">
    <div class="page-title">Planeador Semanal</div>
    <div class="page-title-acciones">
      <ion-button fill="clear" size="small" class="page-title-btn" aria-label="Historial" routerLink="/historial">
        <ion-icon name="calendar-number-outline" slot="icon-only"></ion-icon>
      </ion-button>
      <ion-button fill="clear" size="small" class="page-title-btn" aria-label="Ajustes" routerLink="/ajustes">
        <ion-icon name="settings-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </div>
  </div>
  <p class="page-subtitle">Desayunos y cenas de los próximos 7 días</p>

  <!-- La semana de un vistazo: un punto por comida (vacío, planificada o confirmada) -->
  <nav class="tira" aria-label="Ir a un día">
    @for (d of semana(); track d.fecha) {
      <button
        type="button"
        class="tira-dia"
        [class.tira-dia--hoy]="d.esHoy"
        [attr.aria-label]="d.titulo + ', ' + d.subtitulo"
        (click)="irADia(d.fecha)"
      >
        <span class="tira-letra">{{ d.corto }}</span>
        <span class="tira-numero">{{ d.numero }}</span>
        <span class="tira-puntos">
          @for (c of d.comidas; track c.tipo) {
            <span class="punto" [class.punto--plan]="!!c.comida" [class.punto--ok]="c.confirmado"></span>
          }
        </span>
      </button>
    }
  </nav>

  @for (d of semana(); track d.fecha) {
    <ion-card class="dia" [class.dia--hoy]="d.esHoy" [id]="'dia-' + d.fecha">
      <div class="dia-header">
        <div class="dia-titulos">
          <span class="dia-titulo">{{ d.titulo }}</span>
          <span class="dia-subtitulo">{{ d.subtitulo }}</span>
        </div>
        @if (d.confirmado) {
          <span class="dia-estado dia-estado--ok"><ion-icon name="checkmark-circle"></ion-icon>Confirmado</span>
        } @else if (d.vacio) {
          <span class="dia-estado">Sin plan</span>
        }
      </div>

      @for (c of d.comidas; track c.tipo) {
        <div class="comida" [class.comida--vacia]="!c.comida" [class.comida--ok]="c.confirmado">
          <div class="item-icon {{ tipoIcono[c.tipo].tono }}">
            <ion-icon [name]="tipoIcono[c.tipo].icono"></ion-icon>
          </div>
          <button
            type="button"
            class="item-info comida-btn"
            [attr.aria-label]="tipoLabel[c.tipo] + ' del ' + diasLabel[d.dia] + ': ' + (c.comida?.nombre ?? 'sin asignar')"
            (click)="asignarComida(d, c)"
          >
            <span class="item-label">{{ tipoLabel[c.tipo] }}</span>
            @if (c.comida) {
              <span class="item-nombre">{{ c.comida.nombre }}</span>
              @if (c.falta.length > 0) {
                <span class="comida-falta">
                  <ion-icon name="cart-outline"></ion-icon>
                  <span class="comida-falta-texto">Falta: {{ c.falta.join(', ') }}</span>
                </span>
              }
            } @else {
              <span class="comida-agregar"><ion-icon name="add-outline"></ion-icon>Elegir {{ c.tipo }}</span>
            }
          </button>
          @if (c.comida) {
            <button
              type="button"
              class="check"
              [class.check--ok]="c.confirmado"
              [attr.aria-label]="'Confirmar ' + c.tipo + ' del ' + diasLabel[d.dia]"
              [attr.aria-pressed]="c.confirmado"
              (click)="toggleConfirmar(d, c)"
            >
              <span class="check-circulo"><ion-icon name="checkmark-sharp"></ion-icon></span>
            </button>
          }
        </div>
      }
    </ion-card>
  }
</ion-content>

<ion-fab slot="fixed" horizontal="end" vertical="bottom">
  <ion-fab-button aria-label="Sortear la semana" (click)="sortearSemana()">
    <ion-icon class="float-icon" name="shuffle-outline"></ion-icon>
  </ion-fab-button>
</ion-fab>
